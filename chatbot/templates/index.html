<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI College Chatbot</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
}

.chat-box{
    width:700px;
    margin:40px auto;
    background:white;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,.2);
}

.header{
    background:#0d6efd;
    color:white;
    padding:20px;
    border-radius:15px 15px 0 0;
    font-size:28px;
    font-weight:bold;
}

.messages{
    height:450px;
    padding:20px;
    overflow-y:auto;
}

.bot{
    background:#e9ecef;
    padding:12px;
    border-radius:10px;
    width:70%;
    margin-bottom:15px;
}

.user{
    background:#0d6efd;
    color:white;
    padding:12px;
    border-radius:10px;
    width:70%;
    margin-left:auto;
    margin-bottom:15px;
}

.footer{
    display:flex;
    padding:15px;
}

.footer input{
    flex:1;
    margin-right:10px;
}

</style>

</head>

<body>

<div class="chat-box">

    <div class="header">
        🎓 AI College Chatbot
    </div>

    <div class="messages">

        <div class="bot">
            Hello 👋 <br>
            I am your College Assistant.<br><br>

            Ask me about:
            <ul>
                <li>Courses</li>
                <li>Fees</li>
                <li>Exam Timetable</li>
                <li>Placements</li>
                <li>Faculty</li>
            </ul>
        </div>

        {% if answer %}
        <div class="bot">
            {{ answer }}
        </div>
        {% endif %}

    </div>

    <form method="POST" class="footer">
        {% csrf_token %}

        <input
            type="text"
            name="question"
            class="form-control"
            placeholder="Ask your question..."
            required>

        <button class="btn btn-primary" type="submit">
            Send
        </button>
    </form>

</div>

</body>
</html>
